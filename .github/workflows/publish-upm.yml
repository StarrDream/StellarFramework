name: Publish UPM Package

# 推送 v* 标签（如 v1.0.0）时，自动导出 UPM 包并推送到 upm 分支。
# 开发者通过 Package Manager 安装/更新 com.stellar.framework（git URL 指向 upm 分支或 tag）。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:          # 支持手动触发（用当前 main 导出）

permissions:
  contents: write             # 允许推送 upm 分支

jobs:
  publish-upm:
    name: Export & Push UPM
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 需要完整历史以创建/更新 upm 分支

      # 提取 tag 名作为版本号（v1.0.0 -> 1.0.0）
      - name: Read version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(grep -oP '\"version\": \"\K[^\"]+' Assets/StellarFramework/Editor/StellarToolsHub/Modules/Packaging/StellarFrameworkUPMExporter.cs | head -1)"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 组装 UPM 镜像目录（不依赖 Unity，纯 shell 复制 Runtime/Editor + 写 package.json）
      - name: Assemble UPM package
        shell: bash
        run: |
          set -e
          OUT="upm-out/com.stellar.framework"
          mkdir -p "$OUT"
          # 镜像 Runtime / Editor（排除 Samples、Tests、.meta）
          for F in Runtime Editor; do
            if [ -d "Assets/StellarFramework/$F" ]; then
              mkdir -p "$OUT/$F"
              cp -r "Assets/StellarFramework/$F/." "$OUT/$F/"
              find "$OUT/$F" -name "*.meta" -delete
              find "$OUT/$F" -type d -name "Samples" -prune -exec rm -rf {} +
              find "$OUT/$F" -type d -name "Tests" -prune -exec rm -rf {} +
            fi
          done
          # package.json
          cat > "$OUT/package.json" <<EOF
          {
            "name": "com.stellar.framework",
            "version": "${{ steps.version.outputs.version }}",
            "displayName": "StellarFramework",
            "description": "StellarFramework - MSV architecture + 14 Kits Unity framework (hot update / UI / res / event / audio).",
            "unity": "2022.3",
            "keywords": ["stellar", "framework", "msv", "hotupdate", "ui"],
            "author": { "name": "StarrDream" },
            "dependencies": {
              "com.cysharp.unitask": "https://github.com/Cysharp/UniTask.git?path=src/UniTask/Assets/Plugins/UniTask",
              "com.unity.nuget.newtonsoft-json": "3.2.2",
              "com.unity.addressables": "1.22.3",
              "com.code-philosophy.hybridclr": "https://github.com/focus-creative-games/hybridclr_unity.git#4feac30cb2e105992986c737f7f54992b8300e1a",
              "com.unity.ugui": "1.0.0",
              "com.unity.textmeshpro": "3.0.7"
            }
          }
          EOF
          echo "Assembled package:"
          find "$OUT" -type f | head -5

      # 推送到 upm 分支（仅包内容）
      # 做法：git subtree split 从当前提交生成只含 upm-out/ 的干净提交 → 强推 upm
      - name: Push to upm branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # subtree split：把 upm-out/ 目录拆成独立提交（保留历史）
          # 若 upm 分支已存在，从它继续；否则从当前提交开始
          if git rev-parse --verify origin/upm >/dev/null 2>&1; then
            BASE="origin/upm"
          else
            BASE="HEAD"
          fi

          git subtree split --prefix=upm-out/com.stellar.framework --branch=upm-tmp "$BASE" || \
            git subtree split --prefix=upm-out/com.stellar.framework --branch=upm-tmp

          # 强推 upm 分支
          git push origin upm-tmp:upm --force

      - name: Summary
        run: echo "✅ UPM package ${{ steps.version.outputs.tag }} pushed to upm branch"
