name: Publish UPM Package

# 推送 v* 标签（如 v1.0.0）时，自动导出 UPM 包并推送到 upm 分支。
# 开发者通过 Package Manager 安装/更新 com.stellar.framework（git URL 指向 upm 分支或 tag）。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:          # 支持手动触发（用当前 main 导出）

permissions:
  contents: write             # 允许推送 upm 分支

jobs:
  publish-upm:
    name: Export & Push UPM
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 需要完整历史以创建/更新 upm 分支

      # 提取版本号（v1.0.0 -> 1.0.0）。
      # 手动触发(workflow_dispatch)时 ref_type 是 branch，此时从 UPMExporter 的 PackageVersion 常量读取。
      # 注意：Windows bash 不支持 grep -P 的 \K，改用 sed 提取，兼容性好。
      - name: Read version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(sed -n 's/.*PackageVersion = "\([^"]*\)".*/\1/p' Assets/StellarFramework/Editor/StellarToolsHub/Modules/Packaging/StellarFrameworkUPMExporter.cs | head -1)
            if [ -z "$VER" ]; then
              echo "::error::Could not read PackageVersion from StellarFrameworkUPMExporter.cs"
              exit 1
            fi
            TAG="v$VER"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Read version: $TAG"

      # 组装 UPM 镜像目录（不依赖 Unity，纯 shell 复制 Runtime/Editor + 写 package.json）
      - name: Assemble UPM package
        shell: bash
        run: |
          set -e
          OUT="upm-out/com.stellar.framework"
          mkdir -p "$OUT"
          # 镜像 Runtime / Editor（排除 Samples、Tests；保留所有 .meta 使 GUID 稳定）
          for F in Runtime Editor; do
            if [ -d "Assets/StellarFramework/$F" ]; then
              mkdir -p "$OUT/$F"
              cp -r "Assets/StellarFramework/$F/." "$OUT/$F/"
              find "$OUT/$F" -type d -name "Samples" -prune -exec rm -rf {} +
              find "$OUT/$F" -type d -name "Tests" -prune -exec rm -rf {} +
            fi
          done
          # UPM 包 asmdef 必须用程序集名引用，不能用 GUID：把已知 GUID 替换为程序集名
          find "$OUT" -name "*.asmdef" -print0 | while IFS= read -r -d '' f; do
            sed -i 's/GUID:f51ebe6a0ceec4240a699833d6309b23/UniTask/g; s/GUID:5c01796d064528144a599661eaab93a6/UniTask.Linq/g; s/GUID:ee69db06ccc61304d96f7862cc10f3f9/StellarFramework.Runtime/g' "$f"
          done
          # package.json
          cat > "$OUT/package.json" <<EOF
          {
            "name": "com.stellar.framework",
            "version": "${{ steps.version.outputs.version }}",
            "displayName": "StellarFramework",
            "description": "StellarFramework - MSV architecture + 14 Kits Unity framework (hot update / UI / res / event / audio).",
            "unity": "2022.3",
            "keywords": ["stellar", "framework", "msv", "hotupdate", "ui"],
            "author": { "name": "StarrDream" },
            "dependencies": {
              "com.unity.nuget.newtonsoft-json": "3.2.2",
              "com.unity.addressables": "1.22.3",
              "com.unity.ugui": "1.0.0",
              "com.unity.textmeshpro": "3.0.7"
            }
          }
          EOF
          echo "Assembled package:"
          find "$OUT" -type f | head -5

      # 推送到 upm 分支（仅包内容）
      # 做法：在独立目录 git init（只含包内容）→ 强推 origin upm，完全不碰主仓库工作区
      - name: Push to upm branch
        shell: bash
        run: |
          set -e
          # 独立目录，只放包内容
          PUB_DIR="$RUNNER_TEMP/upm-publish"
          rm -rf "$PUB_DIR"
          mkdir -p "$PUB_DIR"
          cp -r upm-out/com.stellar.framework/. "$PUB_DIR/"

          cd "$PUB_DIR"
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q -b upm
          git add -A
          git commit -q -m "chore: publish UPM package ${{ steps.version.outputs.tag }}"

          # 强推 upm 分支
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q origin upm --force

          echo "✅ Pushed upm branch"

      - name: Summary
        run: echo "✅ UPM package ${{ steps.version.outputs.tag }} pushed to upm branch"
